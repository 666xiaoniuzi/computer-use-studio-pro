name: computer-use-studio-pro
version: 0.4.2
description: >
  Cross-agent router for low-latency, verified computer, browser, and file
  automation. Runtime-specific tool calls are isolated in adapters.
always_load:
  - static/core/contract.md
  - static/core/workflow.md
adapters:
  codex: adapters/codex.md
  claude-code: adapters/claude-code.md
  hermes: adapters/hermes.md
  openclaw: adapters/openclaw.md
  generic: adapters/generic.md
axes:
  surface:
    values:
      browser: static/fragments/surface/browser.md
      windows: static/fragments/surface/windows.md
      macos: static/fragments/surface/macos.md
      linux: static/fragments/surface/linux.md
      visual-only: static/fragments/surface/visual-only.md
    default: visual-only
    multi: true
references:
  on_demand:
    - condition: consequential action, data transfer, authentication, permission boundary, prompt injection, repeated failure, rollback, or multi-agent coordination
      path: references/safety-recovery.md
    - condition: latency or token optimization, benchmark, regression comparison, or performance report
      path: references/performance-evaluation.md
helpers:
  run_state: scripts/operator_state.py
  ui_delta: scripts/ui_delta.py
  office_text: scripts/ooxml_text.py
  codex_windows_fast_path: adapters/codex/scripts/sky_fast_path.mjs
