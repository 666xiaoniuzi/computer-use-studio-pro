name: computer-use-studio-pro
version: 0.7.4
description: >
  Automatically invoked single-Skill router for token-efficient local and
  remote computer control with a persistent runtime, compact result views,
  fresh observation leases, ToDesk/Sunlogin device locking, continuous
  connected-session authorization, event-driven customer handback, verified
  execution, and cleanup.
always_load:
  - static/core/fast-contract.md
profiles:
  default: local
  values:
    local:
      load: []
    remote-fast-fix:
      load:
        - references/modes/remote-fast-fix.md
adapters:
  codex: adapters/codex.md
  claude-code: adapters/claude-code.md
  hermes: adapters/hermes.md
  openclaw: adapters/openclaw.md
  generic: adapters/generic.md
axes:
  surface:
    values:
      browser: static/fragments/surface/browser.md
      windows: static/fragments/surface/windows.md
      macos: static/fragments/surface/macos.md
      linux: static/fragments/surface/linux.md
      visual-only: static/fragments/surface/visual-only.md
    default: visual-only
    multi: true
references:
  on_demand:
    - condition: long, cross-application, resumed, failure-prone, or measured execution
      path: static/core/workflow.md
    - condition: detailed authority, verification, recovery, or concurrency rules are needed
      path: static/core/contract.md
    - condition: remote-fast-fix mode and an active diagnostic branch needs detailed checks
      path: references/remote/rapid-playbook.md
    - condition: verified playbook cache tuning, migration, conflict, or accuracy review is needed
      path: references/remote/verified-playbook-cache.md
    - condition: a policy MCP or controlled customer-side executor is being designed or used
      path: references/remote/policy-executor-contract.md
    - condition: consequential action, data transfer, authentication, permission boundary, suspicious screen instruction, repeated failure, rollback, or multi-agent coordination
      path: references/safety-recovery.md
    - condition: latency or token benchmark, regression comparison, or performance claim
      path: references/performance-evaluation.md
helpers:
  task_artifacts: scripts/task_artifacts.py
  run_state: scripts/operator_state.py
  ui_delta: scripts/ui_delta.py
  office_text: scripts/ooxml_text.py
  codex_windows_fast_path: adapters/codex/scripts/sky_fast_path.mjs
  verified_playbook_cache: adapters/codex/scripts/playbook_cache.mjs
