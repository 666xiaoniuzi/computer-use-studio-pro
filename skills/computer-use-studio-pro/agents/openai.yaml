interface:
  display_name: "Computer Use Studio Pro"
  short_description: "单 Skill：本机控制与低延迟远程维修"
  default_prompt: "使用 $computer-use-studio-pro；远程模式将绑定客户设备的整个电脑作为操作对象，网络、磁盘、设置、应用、终端、服务和注册表均可按任务需要使用；先记录客户设备ID并建立一次会话授权租约，连续连接内复用本机缓存门；客户输入密码时暂停Agent输入并在交还后刷新一次；客户断开、急停或设备ID变化时立即停止输入。重连后重新授权并校验同一设备，再从最后验证检查点继续。任务结束时依次验证结果、清理远程端、断开远程、清理本机端并复核。"
